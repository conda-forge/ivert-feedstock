schema_version: 1

context:
  python_min: "3.12"
  version: "0.7.1"
  build_number: 0
  sha256: "8a5c7014d2997111ebccad594a699fe2c3381a00b0ecb0ed656e99d3600d4c10"

package:
  name: ivert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/ivert/ivert-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ivert = ivert.cli:ivert_cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1.7
    # colorama is required by click on Windows for ANSI color support. Listed
    # unconditionally because noarch packages cannot use platform selectors; it
    # is a small, pure-Python no-op on non-Windows platforms.
    - colorama >=0.4.6
    - dateparser >=1.2.0
    - geopandas >=1.0.0
    - h5py >=3.12.1
    - matplotlib-base >=3.8.0
    - netCDF4 >=1.7.1.post1
    - numpy >=1.26.0
    - packaging >=23.2
    - pandas >=2.1.2
    - psutil >=5.9.6
    - pyogrio >=0.8.0
    - pyproj >=3.7.0
    - pytables >=3.10.0
    - rasterio >=1.4.1
    - scipy >=1.11.2
    - shapely >=2.0.3
    - tabulate >=0.9.0
    - tqdm >=4.66.0
    - xarray >=2023.10.0
    - fetchez >=0.9.1
    - globato >=0.3.9
    - transformez >=1.0.0

tests:
  - python:
      python_version:
        - "${{ python_min }}.*"
        - "*"
      pip_check: true
      imports:
        - ivert 
  - script:
      - ivert --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/continuous-dems/ivert
  repository: https://github.com/continuous-dems/ivert
  summary: The ICESat-2 Validation of Elevations Reporting Tool (IVERT)
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - matth-love
    - mmacferrin 
    - mfisher87
